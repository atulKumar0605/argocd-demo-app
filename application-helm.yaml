apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-demo-app-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/atulKumar0605/argocd-demo-app.git
    targetRevision: main
    path: encyclo-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helm-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
