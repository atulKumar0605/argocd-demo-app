name: Build and Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'encyclo-chart/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/argocd-demo-app:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Update deployment manifests
        run: |
          IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/argocd-demo-app:${{ github.sha }}
          sed -i "s|image: .*argocd-demo-app:.*|image: ${IMAGE_TAG}|" k8s/deployment.yaml
          sed -i "s|repository:.*|repository: ${{ secrets.DOCKERHUB_USERNAME }}/argocd-demo-app|" encyclo-chart/values.yaml
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" encyclo-chart/values.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml encyclo-chart/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
